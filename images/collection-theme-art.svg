<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="artCanvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="45%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="swirlGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="swirlPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="55%" stop-color="#7950C8"/>
      <stop offset="100%" stop-color="#7950C8" stop-opacity="0"/>
    </radialGradient>
    <filter id="artBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Painterly Fine-Art Jigsaw Backdrop -->
  <rect width="800" height="600" fill="url(#artCanvas)"/>
  <circle cx="240" cy="185" r="145" fill="url(#swirlPurple)" filter="url(#artBlur)"/>
  <circle cx="565" cy="165" r="120" fill="url(#swirlGold)" filter="url(#artBlur)"/>

  <!-- Expressive Swirling Brushstroke Arcs -->
  <g fill="none" stroke-linecap="round">
    <path d="M 60 220 C 160 110 290 120 385 190 C 460 245 550 240 660 145" stroke="#a78bfa" stroke-width="26" opacity="0.55"/>
    <path d="M 85 245 C 185 145 285 155 375 215 C 465 275 565 260 695 165" stroke="#f472b6" stroke-width="14" opacity="0.65"/>
    <path d="M 110 175 C 210 75 320 90 415 160 C 505 225 605 210 735 125" stroke="#38bdf8" stroke-width="12" opacity="0.6"/>
  </g>

  <!-- Glowing Crescent & Abstract Sunburst -->
  <circle cx="565" cy="165" r="46" fill="#fde047"/>
  <circle cx="584" cy="154" r="38" fill="#2e2678"/>

  <!-- Geometric Fine-Art Hillside & Village Shapes -->
  <path d="M 0 400 Q 190 295 410 385 T 800 350 L 800 600 L 0 600 Z" fill="#1e1538" opacity="0.92"/>
  <path d="M 0 435 Q 250 355 520 425 T 800 400 L 800 600 L 0 600 Z" fill="#311f57" opacity="0.88"/>

  <!-- Foreground Color Palette Brush Accents -->
  <g stroke-width="14" stroke-linecap="round" opacity="0.8">
    <line x1="95" y1="340" x2="185" y2="310" stroke="#fbbf24"/>
    <line x1="255" y1="330" x2="355" y2="345" stroke="#34d399"/>
    <line x1="465" y1="345" x2="575" y2="320" stroke="#c084fc"/>
  </g>

  <!-- Crisp Jigsaw Interlock Cut Lines -->
  <g fill="none" stroke="#0c081a" stroke-width="2" stroke-opacity="0.48">
    <path d="M 0 140 L 120 140 C 120 128 138 128 138 140 L 260 140 C 260 152 278 152 278 140 L 400 140 C 400 128 418 128 418 140 L 540 140 C 540 152 558 152 558 140 L 680 140 C 680 128 698 128 698 140 L 800 140"/>
    <path d="M 0 280 L 120 280 C 120 292 138 292 138 280 L 260 280 C 260 268 278 268 278 280 L 400 280 C 400 292 418 292 418 280 L 540 280 C 540 268 558 268 558 280 L 680 280 C 680 292 698 292 698 280 L 800 280"/>
    <path d="M 200 0 L 200 75 C 212 75 212 93 200 93 L 200 205 C 188 205 188 223 200 223 L 200 600"/>
    <path d="M 400 0 L 400 75 C 388 75 388 93 400 93 L 400 205 C 412 205 412 223 400 223 L 400 600"/>
    <path d="M 600 0 L 600 75 C 612 75 612 93 600 93 L 600 205 C 588 205 588 223 600 223 L 600 600"/>
  </g>
</svg>
