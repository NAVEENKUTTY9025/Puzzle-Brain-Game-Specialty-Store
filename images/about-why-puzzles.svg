<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Metal and Wooden Brain Teaser Craft</title>
  <desc>Artisan wooden workbench displaying interconnected chrome wire brain teaser puzzles, brass logic ring, and 3D wooden burr cube curated for quality.</desc>
  <defs>
    <linearGradient id="woodDesk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6b4423"/>
      <stop offset="50%" stop-color="#533317"/>
      <stop offset="100%" stop-color="#3b220d"/>
    </linearGradient>
    <linearGradient id="woodGrain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#875930" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#361e0a" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#875930" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="matBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#221938"/>
      <stop offset="100%" stop-color="#140e24"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#dbe2ea"/>
      <stop offset="70%" stop-color="#7c8798"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#d49b1a"/>
      <stop offset="100%" stop-color="#8a5e08"/>
    </linearGradient>
    <linearGradient id="purpleAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a88ae3"/>
      <stop offset="100%" stop-color="#6d43c0"/>
    </linearGradient>
    <linearGradient id="oak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ebc48b"/>
      <stop offset="100%" stop-color="#b87b35"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="145%" height="145%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#090512" flood-opacity="0.55"/>
    </filter>
    <filter id="wireDrop" x="-20%" y="-20%" width="145%" height="145%">
      <feDropShadow dx="2" dy="6" stdDeviation="4" flood-color="#05030a" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Warm Craft Workbench -->
  <rect width="800" height="600" fill="url(#woodDesk)"/>
  <g fill="url(#woodGrain)">
    <rect y="0" width="800" height="120"/>
    <rect y="122" width="800" height="118"/>
    <rect y="242" width="800" height="120"/>
    <rect y="364" width="800" height="116"/>
    <rect y="482" width="800" height="118"/>
  </g>
  <g stroke="#2a1606" stroke-width="2" opacity="0.45">
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="241" x2="800" y2="241"/>
    <line x1="0" y1="363" x2="800" y2="363"/>
    <line x1="0" y1="481" x2="800" y2="481"/>
  </g>

  <!-- Centered MindPiece Felt Inspection Tray -->
  <g transform="translate(85, 65)" filter="url(#drop)">
    <rect x="0" y="0" width="630" height="470" rx="26" fill="url(#matBg)" stroke="#7950C8" stroke-width="4"/>
    <rect x="16" y="16" width="598" height="438" rx="18" fill="none" stroke="#9b7ad9" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="8 6"/>
  </g>

  <!-- Teaser 1: Interlocked Chrome Horseshoe & Ring (Top-Left) -->
  <g transform="translate(230, 200)" filter="url(#wireDrop)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-42,-42 V12 C-42,46 14,46 14,12 V-42" stroke="url(#chrome)" stroke-width="11"/>
    <path d="M-12,-48 V8 C-12,38 42,38 42,8 V-48" stroke="url(#chrome)" stroke-width="11"/>
    <circle cx="-42" cy="-46" r="9" stroke="url(#chrome)" stroke-width="8"/>
    <circle cx="14" cy="-46" r="9" stroke="url(#chrome)" stroke-width="8"/>
    <circle cx="-12" cy="-52" r="9" stroke="url(#chrome)" stroke-width="8"/>
    <circle cx="42" cy="-52" r="9" stroke="url(#chrome)" stroke-width="8"/>
    <ellipse cx="0" cy="40" rx="34" ry="18" stroke="url(#brass)" stroke-width="9"/>
  </g>

  <!-- Teaser 2: Spiral Spring & Linked Ring Puzzle (Top-Center) -->
  <g transform="translate(405, 195)" filter="url(#wireDrop)" fill="none" stroke-linecap="round">
    <path d="M-36,-48 C36,-56 36,-32 -36,-32 C36,-40 36,-16 -36,-16 C36,-24 36,0 -36,0 C36,-8 36,16 -36,16 C36,8 36,32 -36,32 C36,24 36,48 -36,48" stroke="url(#chrome)" stroke-width="9"/>
    <circle cx="28" cy="-2" r="28" stroke="url(#chrome)" stroke-width="9"/>
    <circle cx="0" cy="0" r="18" stroke="url(#purpleAccent)" stroke-width="7"/>
  </g>

  <!-- Teaser 3: Keyhole & Wire Loop Disentanglement (Top-Right) -->
  <g transform="translate(570, 200)" filter="url(#wireDrop)" fill="none" stroke-linecap="round">
    <rect x="-28" y="-54" width="56" height="86" rx="28" stroke="url(#chrome)" stroke-width="10"/>
    <circle cx="0" cy="24" r="32" stroke="url(#brass)" stroke-width="9"/>
    <line x1="0" y1="-30" x2="0" y2="52" stroke="url(#chrome)" stroke-width="10"/>
    <circle cx="0" cy="-30" r="10" fill="#140e24" stroke="url(#chrome)" stroke-width="7"/>
  </g>

  <!-- Bottom Row Left: Brass Cylinder Logic Lock -->
  <g transform="translate(230, 390)" filter="url(#wireDrop)">
    <rect x="-42" y="-34" width="84" height="68" rx="12" fill="url(#brass)" stroke="#5c3e04" stroke-width="2"/>
    <rect x="-24" y="-42" width="16" height="84" rx="5" fill="#fef3c7" stroke="#8a5e08" stroke-width="1.5"/>
    <rect x="8" y="-42" width="16" height="84" rx="5" fill="#fef3c7" stroke="#8a5e08" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="12" fill="#140e24" stroke="#fde68a" stroke-width="2"/>
  </g>

  <!-- Bottom Row Center: Interlocking 3D Wooden & Purple Burr Star -->
  <g transform="translate(405, 392)" filter="url(#wireDrop)">
    <rect x="-56" y="-14" width="112" height="28" rx="4" fill="url(#oak)" stroke="#5e3619" stroke-width="1.8"/>
    <rect x="-14" y="-56" width="28" height="112" rx="4" fill="url(#oak)" stroke="#5e3619" stroke-width="1.8"/>
    <rect x="-50" y="-14" width="100" height="28" rx="4" transform="rotate(45)" fill="url(#purpleAccent)" stroke="#2e1065" stroke-width="1.8"/>
    <rect x="-14" y="-50" width="28" height="100" rx="4" transform="rotate(45)" fill="url(#oak)" stroke="#5e3619" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="10" fill="#fde68a"/>
  </g>

  <!-- Bottom Row Right: MindPiece Quality Seal Medallion -->
  <g transform="translate(570, 392)" filter="url(#wireDrop)">
    <circle cx="0" cy="0" r="46" fill="url(#purpleAccent)" stroke="#e9d8fd" stroke-width="3"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7"/>
    <path d="M-14,2 L-4,12 L16,-10" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
