<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="stratStage" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#1e1834"/>
      <stop offset="55%" stop-color="#120e21"/>
      <stop offset="100%" stop-color="#080610"/>
    </radialGradient>
    <linearGradient id="boardEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d2a1c"/>
      <stop offset="100%" stop-color="#1c120a"/>
    </linearGradient>
    <linearGradient id="sqLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8d3b5"/>
      <stop offset="100%" stop-color="#cbb08a"/>
    </linearGradient>
    <linearGradient id="sqDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6b4423"/>
      <stop offset="100%" stop-color="#3f2611"/>
    </linearGradient>
    <linearGradient id="goldPiece" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="45%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="purplePiece" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="50%" stop-color="#7950C8"/>
      <stop offset="100%" stop-color="#3b1d75"/>
    </linearGradient>
    <linearGradient id="silverPiece" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="stratDrop" x="-20%" y="-20%" width="145%" height="145%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Dark Atmospheric Backdrop -->
  <rect width="800" height="600" fill="url(#stratStage)"/>
  <ellipse cx="400" cy="340" rx="345" ry="65" fill="#171328" stroke="#7950C8" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Isometric Chess & Strategy Board -->
  <g transform="translate(400, 230)" filter="url(#stratDrop)">
    <!-- Wooden Board Base -->
    <polygon points="0,-100 230,-15 0,70 -230,-15" fill="url(#boardEdge)" stroke="#1a0f07" stroke-width="3"/>
    <polygon points="-230,-15 0,70 0,92 -230,7" fill="#24140a" stroke="#120904" stroke-width="2"/>
    <polygon points="230,-15 0,70 0,92 230,7" fill="#170c06" stroke="#120904" stroke-width="2"/>

    <!-- Inner Playing Surface (4x4 Isometric Grid) -->
    <g transform="scale(0.88) translate(0, -10)">
      <!-- Row 0 -->
      <polygon points="0,-90 50,-70 0,-50 -50,-70" fill="url(#sqLight)"/>
      <polygon points="50,-70 100,-50 50,-30 0,-50" fill="url(#sqDark)"/>
      <polygon points="100,-50 150,-30 100,-10 50,-30" fill="url(#sqLight)"/>
      <polygon points="150,-30 200,-10 150,10 100,-10" fill="url(#sqDark)"/>

      <!-- Row 1 -->
      <polygon points="-50,-70 0,-50 -50,-30 -100,-50" fill="url(#sqDark)"/>
      <polygon points="0,-50 50,-30 0,-10 -50,-30" fill="url(#sqLight)"/>
      <polygon points="50,-30 100,-10 50,10 0,-10" fill="url(#sqDark)"/>
      <polygon points="100,-10 150,10 100,30 50,10" fill="url(#sqLight)"/>

      <!-- Row 2 -->
      <polygon points="-100,-50 -50,-30 -100,-10 -150,-30" fill="url(#sqLight)"/>
      <polygon points="-50,-30 0,-10 -50,10 -100,-10" fill="url(#sqDark)"/>
      <polygon points="0,-10 50,10 0,30 -50,10" fill="url(#sqLight)"/>
      <polygon points="50,10 100,30 50,50 0,30" fill="url(#sqDark)"/>

      <!-- Row 3 -->
      <polygon points="-150,-30 -100,-10 -150,10 -200,-10" fill="url(#sqDark)"/>
      <polygon points="-100,-10 -50,10 -100,30 -150,10" fill="url(#sqLight)"/>
      <polygon points="-50,10 0,30 -50,50 -100,30" fill="url(#sqDark)"/>
      <polygon points="0,30 50,50 0,70 -50,50" fill="url(#sqLight)"/>
    </g>

    <!-- Chess King (Center-Left) -->
    <g transform="translate(-45, -30)" filter="url(#stratDrop)">
      <!-- Base -->
      <ellipse cx="0" cy="18" rx="28" ry="12" fill="url(#goldPiece)"/>
      <path d="M -18,15 L -10,-45 L 10,-45 L 18,15 Z" fill="url(#goldPiece)"/>
      <!-- Collar -->
      <ellipse cx="0" cy="-45" rx="16" ry="6" fill="#fde68a"/>
      <!-- Head / Crown -->
      <ellipse cx="0" cy="-60" rx="20" ry="10" fill="url(#goldPiece)"/>
      <path d="M -18,-60 L -24,-78 L -8,-70 L 0,-85 L 8,-70 L 24,-78 L 18,-60 Z" fill="url(#goldPiece)"/>
      <!-- Cross finial -->
      <rect x="-3" y="-96" width="6" height="15" fill="#fef08a"/>
      <rect x="-8" y="-91" width="16" height="5" fill="#fef08a"/>
    </g>

    <!-- Chess Knight (Right-Front) -->
    <g transform="translate(65, 10)" filter="url(#stratDrop)">
      <!-- Base -->
      <ellipse cx="0" cy="15" rx="24" ry="10" fill="url(#purplePiece)"/>
      <!-- Mane / Neck -->
      <path d="M -15,10 C -22,-10 -16,-35 -8,-50 C -4,-58 10,-55 18,-45 C 24,-38 22,-24 14,-15 C 20,0 18,8 14,12 Z" fill="url(#purplePiece)"/>
      <!-- Snout -->
      <path d="M 8,-48 C 22,-44 32,-35 28,-26 C 24,-20 15,-22 10,-24 Z" fill="url(#purplePiece)"/>
      <!-- Eye -->
      <circle cx="10" cy="-38" r="2.5" fill="#ffffff"/>
      <!-- Crown / Ear -->
      <polygon points="-4,-52 -1,-64 6,-54" fill="#c4b5fd"/>
    </g>

    <!-- Chess Pawn (Left-Front) -->
    <g transform="translate(-105, 12)" filter="url(#stratDrop)">
      <ellipse cx="0" cy="10" rx="18" ry="8" fill="url(#silverPiece)"/>
      <path d="M -11,8 L -6,-20 L 6,-20 L 11,8 Z" fill="url(#silverPiece)"/>
      <ellipse cx="0" cy="-20" rx="10" ry="4" fill="#ffffff"/>
      <circle cx="0" cy="-30" r="11" fill="url(#silverPiece)"/>
    </g>
  </g>
</svg>