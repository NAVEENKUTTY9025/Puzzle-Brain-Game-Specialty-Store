<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="MindPiece Curated Puzzles, 3D Wooden Builds, Brain Teasers, and Strategy Games Showcase">
  <defs>
    <linearGradient id="sh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22193c"/>
      <stop offset="55%" stop-color="#2e2152"/>
      <stop offset="100%" stop-color="#160f28"/>
    </linearGradient>
    <radialGradient id="sh-spot" cx="50%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#b497eb" stop-opacity="0.34"/>
      <stop offset="60%" stop-color="#7950C8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#7950C8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sh-shelf-top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7f4fc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ece6f8"/>
    </linearGradient>
    <linearGradient id="sh-shelf-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c99c68"/>
      <stop offset="100%" stop-color="#9e7242"/>
    </linearGradient>
    <linearGradient id="sh-board-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b4423"/>
      <stop offset="100%" stop-color="#482c15"/>
    </linearGradient>
    <linearGradient id="sh-tile-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6b43b8"/>
    </linearGradient>
    <linearGradient id="sh-tile-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="sh-tile-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="sh-tile-coral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="sh-wood-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1d3a8"/>
      <stop offset="100%" stop-color="#c99b63"/>
    </linearGradient>
    <linearGradient id="sh-wood-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c48b51"/>
      <stop offset="100%" stop-color="#8b592b"/>
    </linearGradient>
    <linearGradient id="sh-wood-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b592b"/>
      <stop offset="100%" stop-color="#523215"/>
    </linearGradient>
    <linearGradient id="sh-steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="45%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="sh-shadow" x="-15%" y="-15%" width="135%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#0b0618" flood-opacity="0.42"/>
    </filter>
    <filter id="sh-item" x="-15%" y="-15%" width="135%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#191030" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Showcase Studio Background -->
  <rect width="800" height="600" fill="url(#sh-bg)"/>
  <circle cx="400" cy="250" r="335" fill="url(#sh-spot)"/>

  <!-- Subtle Background Grid & Decorative Arches -->
  <path d="M 140 480 L 140 235 A 260 215 0 0 1 660 235 L 660 480" fill="none" stroke="#9b7ad9" stroke-width="1.5" stroke-opacity="0.16"/>
  <path d="M 185 480 L 185 245 A 215 175 0 0 1 615 245 L 615 480" fill="none" stroke="#9b7ad9" stroke-width="1" stroke-opacity="0.1"/>

  <!-- Two-Tiered Store Display Plinth -->
  <g filter="url(#sh-shadow)">
    <!-- Back Upper Shelf Pedestal -->
    <rect x="130" y="348" width="540" height="24" rx="8" fill="url(#sh-shelf-top)"/>
    <rect x="144" y="372" width="512" height="58" fill="#dfd7f2"/>

    <!-- Front Wide Display Counter -->
    <path d="M 78 446 L 722 446 L 758 498 L 42 498 Z" fill="url(#sh-shelf-top)"/>
    <rect x="42" y="498" width="716" height="44" rx="6" fill="url(#sh-shelf-front)"/>
    <line x1="78" y1="448" x2="722" y2="448" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- 1. TOP LEFT/CENTER: Artisan Jigsaw Puzzle Easel -->
  <g transform="translate(152, 108)" filter="url(#sh-item)">
    <!-- Wooden Easel Legs -->
    <line x1="55" y1="226" x2="36" y2="254" stroke="#5b3a1d" stroke-width="10" stroke-linecap="round"/>
    <line x1="215" y1="226" x2="234" y2="254" stroke="#5b3a1d" stroke-width="10" stroke-linecap="round"/>

    <!-- Framed Jigsaw Canvas -->
    <rect x="0" y="0" width="270" height="232" rx="16" fill="url(#sh-board-frame)"/>
    <rect x="14" y="14" width="242" height="204" rx="10" fill="#1e1533"/>

    <!-- 3x2 Crisp Mosaic Jigsaw Grid (Row 1) -->
    <rect x="24" y="24" width="70" height="88" rx="6" fill="url(#sh-tile-purple)"/>
    <circle cx="95" cy="68" r="11" fill="url(#sh-tile-purple)"/>

    <rect x="98" y="24" width="72" height="88" rx="6" fill="url(#sh-tile-teal)"/>
    <circle cx="134" cy="113" r="11" fill="url(#sh-tile-teal)"/>

    <rect x="174" y="24" width="72" height="88" rx="6" fill="url(#sh-tile-amber)"/>
    <circle cx="173" cy="68" r="11" fill="url(#sh-tile-amber)"/>

    <!-- Row 2 -->
    <rect x="24" y="116" width="70" height="88" rx="6" fill="url(#sh-tile-coral)"/>
    <circle cx="59" cy="115" r="11" fill="url(#sh-tile-coral)"/>

    <rect x="98" y="116" width="72" height="88" rx="6" fill="url(#sh-tile-amber)"/>
    <circle cx="97" cy="160" r="11" fill="url(#sh-tile-amber)"/>

    <!-- Recessed Slot Waiting for Final Glowing Piece -->
    <rect x="174" y="116" width="72" height="88" rx="6" fill="#2d204b" stroke="#7950C8" stroke-width="2" stroke-dasharray="5 4"/>

    <!-- Floating Final Piece Snapping In -->
    <g transform="translate(202, 134) rotate(-10)">
      <rect x="0" y="0" width="74" height="88" rx="8" fill="url(#sh-tile-purple)" stroke="#ffffff" stroke-width="2.5"/>
      <circle cx="37" cy="-2" r="11" fill="url(#sh-tile-purple)"/>
      <circle cx="-1" cy="44" r="11" fill="url(#sh-tile-purple)"/>
      <path d="M 14,16 L 56,16" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.35"/>
    </g>
  </g>

  <!-- 2. TOP RIGHT: 3D Interlocking Wooden Burr Cube -->
  <g transform="translate(476, 132)" filter="url(#sh-item)">
    <!-- Pedestal Riser -->
    <rect x="18" y="198" width="150" height="22" rx="6" fill="#e5ddf6"/>

    <!-- Isometric 3D Wooden Burr Puzzle Sculpture -->
    <g transform="translate(94, 108)">
      <!-- Back/Left Dark Walnut Beams -->
      <polygon points="-76,-28 -18,-62 0,-52 -58,-18" fill="url(#sh-wood-light)"/>
      <polygon points="-76,-28 -58,-18 -58,42 -76,32" fill="url(#sh-wood-mid)"/>
      <polygon points="-58,-18 0,-52 0,8 -58,42" fill="url(#sh-wood-dark)"/>

      <!-- Central Vertical Walnut Pillar -->
      <polygon points="-24,-78 24,-78 24,56 -24,56" fill="url(#sh-wood-dark)" opacity="0.2"/>
      <polygon points="-30,-74 0,-92 30,-74 0,-56" fill="url(#sh-wood-light)"/>
      <polygon points="-30,-74 0,-56 0,74 -30,56" fill="url(#sh-wood-mid)"/>
      <polygon points="0,-56 30,-74 30,56 0,74" fill="url(#sh-wood-dark)"/>

      <!-- Cross-Locking Horizontal Light Maple Beam -->
      <polygon points="-74,-2 48,-72 78,-54 -44,16" fill="url(#sh-wood-light)"/>
      <polygon points="-74,-2 -44,16 -44,48 -74,30" fill="url(#sh-wood-mid)"/>
      <polygon points="-44,16 78,-54 78,-22 -44,48" fill="url(#sh-wood-dark)"/>

      <!-- Front Gold Accent Pin -->
      <polygon points="-14,-20 14,-36 14,-10 -14,6" fill="#fbbf24" opacity="0.92"/>
      <polygon points="-14,-20 0,-28 14,-20 0,-12" fill="#fef3c7"/>
    </g>
  </g>

  <!-- 3. FRONT LEFT PLINTH: Brushed Steel Wire Brain Teaser Rings -->
  <g transform="translate(132, 344)" filter="url(#sh-item)">
    <!-- Display Base -->
    <rect x="8" y="106" width="144" height="18" rx="6" fill="#2e224f"/>
    <!-- Interlocking Steel Teaser Rings -->
    <ellipse cx="64" cy="64" rx="46" ry="30" transform="rotate(-18 64 64)" fill="none" stroke="url(#sh-steel)" stroke-width="11"/>
    <ellipse cx="102" cy="60" rx="42" ry="26" transform="rotate(24 102 60)" fill="none" stroke="#94a3b8" stroke-width="10"/>
    <!-- Front Over-crossing Ring Segment for Authentic Interlock Illusion -->
    <path d="M 32,46 A 46,30 -18 0,1 96,42" fill="none" stroke="url(#sh-steel)" stroke-width="11" stroke-linecap="round"/>
    <!-- Brass Center Clasp -->
    <circle cx="82" cy="52" r="10" fill="#f59e0b" stroke="#fef3c7" stroke-width="2"/>
  </g>

  <!-- 4. FRONT CENTER: Curated MindPiece Collector Cube Box -->
  <g transform="translate(328, 358)" filter="url(#sh-item)">
    <rect x="0" y="12" width="144" height="96" rx="12" fill="#7950C8" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="-4" y="0" width="152" height="24" rx="8" fill="#5e3b9e" stroke="#ddd6fe" stroke-width="2"/>
    <!-- Cream Collector Emblem Circle -->
    <circle cx="72" cy="64" r="26" fill="#ffffff"/>
    <!-- Purple Puzzle Piece Icon inside Box Crest -->
    <rect x="61" y="55" width="22" height="20" rx="4" fill="#7950C8"/>
    <circle cx="72" cy="53" r="5" fill="#7950C8"/>
    <circle cx="85" cy="65" r="5" fill="#7950C8"/>
    <!-- Highlight -->
    <line x1="14" y1="7" x2="128" y2="7" stroke="#ffffff" stroke-width="2" stroke-opacity="0.35" stroke-linecap="round"/>
  </g>

  <!-- 5. FRONT RIGHT PLINTH: Strategy Walnut Chess Set Duo -->
  <g transform="translate(524, 342)" filter="url(#sh-item)">
    <!-- Mini Checkered Strategy Board Base -->
    <rect x="6" y="102" width="154" height="20" rx="5" fill="#4f3016"/>
    <rect x="14" y="102" width="34" height="10" fill="#f3dfc1"/>
    <rect x="48" y="102" width="34" height="10" fill="#6b4221"/>
    <rect x="82" y="102" width="34" height="10" fill="#f3dfc1"/>
    <rect x="116" y="102" width="34" height="10" fill="#6b4221"/>

    <!-- Tall Turned Maple Queen/King Silhouette -->
    <g transform="translate(48, 8)">
      <ellipse cx="20" cy="92" rx="22" ry="6" fill="url(#sh-wood-light)"/>
      <path d="M 6,90 C 11,64 12,44 10,28 L 30,28 C 28,44 29,64 34,90 Z" fill="url(#sh-wood-light)"/>
      <rect x="5" y="20" width="30" height="8" rx="4" fill="#e9c496"/>
      <path d="M 7,20 L 11,8 L 20,14 L 29,8 L 33,20 Z" fill="url(#sh-wood-light)"/>
      <circle cx="20" cy="5" r="4" fill="#fbbf24"/>
    </g>

    <!-- Walnut Knight Silhouette -->
    <g transform="translate(96, 22)">
      <ellipse cx="22" cy="78" rx="20" ry="5.5" fill="url(#sh-wood-dark)"/>
      <path d="M 8,76 C 12,56 14,44 12,26 C 12,12 24,4 32,8 L 40,18 L 33,24 C 31,26 26,24 24,30 C 26,42 32,54 36,76 Z" fill="url(#sh-wood-dark)"/>
      <path d="M 15,24 C 17,15 24,11 29,12" fill="none" stroke="#c48b51" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
