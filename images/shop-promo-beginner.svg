<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="begBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4effc"/>
      <stop offset="55%" stop-color="#e7dff8"/>
      <stop offset="100%" stop-color="#3c285e"/>
    </linearGradient>
    <linearGradient id="begTable" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e4c8a2"/>
      <stop offset="100%" stop-color="#b98f5c"/>
    </linearGradient>
    <linearGradient id="pPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d3fc4"/>
    </linearGradient>
    <linearGradient id="pTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0f9f92"/>
    </linearGradient>
    <linearGradient id="pAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="pCoral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="begShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#1e1035" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#begBg)"/>
  <rect y="290" width="800" height="310" fill="url(#begTable)" opacity="0.7"/>
  <!-- Soft natural sunlight beam -->
  <polygon points="0,0 440,0 240,600 0,600" fill="#ffffff" opacity="0.2"/>

  <!-- Interlocking Colorful Starter Puzzle Cluster (upper-center focal zone) -->
  <g transform="translate(215, 78)" filter="url(#begShadow)">
    <!-- Top-Left Purple Piece -->
    <path d="M 30 30 L 115 30 L 115 65 C 132 65 132 95 115 95 L 115 130 L 82 130 C 82 147 52 147 52 130 L 30 130 Z" fill="url(#pPurple)" stroke="#ffffff" stroke-width="3"/>
    <!-- Top-Right Teal Piece -->
    <path d="M 118 30 L 205 30 L 205 130 L 172 130 C 172 113 142 113 142 130 L 118 130 L 118 95 C 135 95 135 65 118 65 Z" fill="url(#pTeal)" stroke="#ffffff" stroke-width="3"/>
    <!-- Bottom-Left Amber Piece -->
    <path d="M 30 133 L 52 133 C 52 150 82 150 82 133 L 115 133 L 115 168 C 98 168 98 198 115 198 L 115 230 L 30 230 Z" fill="url(#pAmber)" stroke="#ffffff" stroke-width="3"/>
    <!-- Bottom-Right Coral Piece (slightly pulled out, inviting to click in!) -->
    <g transform="translate(28, 18) rotate(8 160 180)">
      <path d="M 118 133 L 142 133 C 142 116 172 116 172 133 L 205 133 L 205 230 L 118 230 L 118 198 C 101 198 101 168 118 168 Z" fill="url(#pCoral)" stroke="#ffffff" stroke-width="3"/>
    </g>
  </g>

  <!-- Beginner Wooden Tangram / Geometric Shapes on Left & Right -->
  <g transform="translate(105, 195) rotate(-14)" filter="url(#begShadow)">
    <polygon points="0,0 76,0 38,66" fill="url(#pAmber)" stroke="#92400e" stroke-width="2"/>
  </g>
  <g transform="translate(545, 125) rotate(12)" filter="url(#begShadow)">
    <rect x="0" y="0" width="76" height="76" rx="10" fill="url(#pTeal)" stroke="#115e59" stroke-width="2"/>
    <circle cx="38" cy="38" r="18" fill="#ffffff" opacity="0.35"/>
  </g>
  <g transform="translate(590, 240) rotate(-10)" filter="url(#begShadow)">
    <circle cx="42" cy="42" r="40" fill="url(#pPurple)" stroke="#3b2069" stroke-width="2"/>
    <path d="M 22 42 L 62 42 M 42 22 L 42 62" stroke="#ffffff" stroke-width="3" opacity="0.45" stroke-linecap="round"/>
  </g>
</svg>
