<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="anBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b3a36"/>
      <stop offset="60%" stop-color="#112624"/>
      <stop offset="100%" stop-color="#091413"/>
    </linearGradient>
    <linearGradient id="foxOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="foxCream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="owlWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4a76a"/>
      <stop offset="100%" stop-color="#8b5a34"/>
    </linearGradient>
    <linearGradient id="deerPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#5e3b9e"/>
    </linearGradient>
    <filter id="anShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#040a09" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Forest Slate Backdrop -->
  <rect width="800" height="600" fill="url(#anBg)"/>
  <circle cx="400" cy="240" r="240" fill="#2dd4bf" opacity="0.08"/>

  <!-- Geometric Wooden Animal Puzzle Showcase (Centered Safe Frame) -->
  <!-- Left: Wooden Owl Puzzle Piece -->
  <g transform="translate(215, 195) scale(0.85)" filter="url(#anShadow)">
    <polygon points="-50,-65 -20,-42 20,-42 50,-65 55,15 35,70 -35,70 -55,15" fill="url(#owlWood)" stroke="#3d220d" stroke-width="2.5"/>
    <polygon points="0,-42 35,70 -35,70" fill="#b78343" stroke="#3d220d" stroke-width="2"/>
    <!-- Owl Eyes & Beak -->
    <circle cx="-20" cy="-12" r="14" fill="#fef3c7" stroke="#3d220d" stroke-width="2"/>
    <circle cx="20" cy="-12" r="14" fill="#fef3c7" stroke="#3d220d" stroke-width="2"/>
    <circle cx="-20" cy="-12" r="5" fill="#1e1b4b"/>
    <circle cx="20" cy="-12" r="5" fill="#1e1b4b"/>
    <polygon points="-7,2 7,2 0,15" fill="#f59e0b"/>
  </g>

  <!-- Center: Geometric Interlocking Fox Puzzle -->
  <g transform="translate(395, 240) scale(0.9)" filter="url(#anShadow)">
    <!-- Fox Body (Multi-facet wooden puzzle pieces) -->
    <polygon points="-85,78 -35,-15 45,-15 95,78" fill="url(#foxOrange)" stroke="#431407" stroke-width="2.5"/>
    <polygon points="-35,-15 5,32 45,-15" fill="#ea580c" stroke="#431407" stroke-width="2"/>
    <!-- Fox Tail -->
    <polygon points="45,-15 115,20 95,78 45,48" fill="url(#foxOrange)" stroke="#431407" stroke-width="2.5"/>
    <polygon points="115,20 135,55 95,78" fill="url(#foxCream)" stroke="#431407" stroke-width="2"/>
    <!-- Fox Head -->
    <polygon points="-52,-88 -25,-48 15,-48 42,-88 32,-25 -5,5 -42,-25" fill="url(#foxOrange)" stroke="#431407" stroke-width="2.5"/>
    <polygon points="-42,-25 -5,5 -5,-28" fill="url(#foxCream)" stroke="#431407" stroke-width="1.8"/>
    <polygon points="32,-25 -5,5 -5,-28" fill="url(#foxCream)" stroke="#431407" stroke-width="1.8"/>
    <circle cx="-18" cy="-36" r="4" fill="#1c1917"/>
    <circle cx="8" cy="-36" r="4" fill="#1c1917"/>
    <circle cx="-5" cy="2" r="5" fill="#1c1917"/>
  </g>

  <!-- Right: Purple Geometric Stag / Origami Animal Piece -->
  <g transform="translate(595, 200) scale(0.88)" filter="url(#anShadow)">
    <polygon points="-40,75 -20,-10 35,-10 50,75" fill="url(#deerPurple)" stroke="#2e1065" stroke-width="2.5"/>
    <polygon points="-20,-10 0,-60 35,-10" fill="#c084fc" stroke="#2e1065" stroke-width="2"/>
    <!-- Antlers -->
    <path d="M -4 -54 L -24 -88 M -14 -72 L -2 -82 M 12 -52 L 32 -86 M 22 -70 L 10 -80" stroke="#fde68a" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Subtle Puzzle Seams -->
  <g fill="none" stroke="#a7f3d0" stroke-width="1.5" stroke-opacity="0.22">
    <path d="M 0 120 L 210 120 C 210 108 228 108 228 120 L 550 120 C 550 132 568 132 568 120 L 800 120"/>
    <path d="M 0 330 L 280 330 C 280 342 298 342 298 330 L 600 330 C 600 318 618 318 618 330 L 800 330"/>
  </g>
</svg>
