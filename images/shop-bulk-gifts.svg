<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="studioWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f5fc"/>
      <stop offset="72%" stop-color="#ede8f9"/>
      <stop offset="100%" stop-color="#e1d9f4"/>
    </linearGradient>
    <linearGradient id="tableSurface" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e5c89e"/>
      <stop offset="50%" stop-color="#edd5b3"/>
      <stop offset="100%" stop-color="#d8b482"/>
    </linearGradient>
    <linearGradient id="boxWhite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eae6f5"/>
    </linearGradient>
    <linearGradient id="boxLid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2effb"/>
    </linearGradient>
    <linearGradient id="purpleRibbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9b7ad9"/>
      <stop offset="50%" stop-color="#7950C8"/>
      <stop offset="100%" stop-color="#5e3b9e"/>
    </linearGradient>
    <linearGradient id="kraftTag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e3c090"/>
      <stop offset="100%" stop-color="#c3975e"/>
    </linearGradient>
    <linearGradient id="woodBurr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b87e49"/>
      <stop offset="100%" stop-color="#6d4222"/>
    </linearGradient>
    <linearGradient id="woodLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eac796"/>
      <stop offset="100%" stop-color="#ba884d"/>
    </linearGradient>
    <filter id="boxDrop" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#2a1e3d" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Backdrop and Tabletop -->
  <rect width="800" height="475" fill="url(#studioWall)"/>
  <rect y="465" width="800" height="135" fill="url(#tableSurface)"/>
  <line x1="0" y1="465" x2="800" y2="465" stroke="#c89e69" stroke-width="2"/>

  <!-- Soft Table Shadow -->
  <ellipse cx="320" cy="508" rx="220" ry="22" fill="#5e3b9e" opacity="0.16"/>
  <ellipse cx="620" cy="512" rx="115" ry="18" fill="#5e3b9e" opacity="0.15"/>

  <!-- Stack of 4 Gift-Wrapped Puzzle Boxes -->
  <!-- Box 4 (Bottom, Largest) -->
  <g filter="url(#boxDrop)">
    <rect x="120" y="408" width="380" height="92" rx="6" fill="url(#boxWhite)" stroke="#d8d0ea" stroke-width="2"/>
    <rect x="114" y="394" width="392" height="24" rx="5" fill="url(#boxLid)" stroke="#d0c6e5" stroke-width="2"/>
    <!-- Purple Ribbon Vertical -->
    <rect x="285" y="394" width="48" height="106" fill="url(#purpleRibbon)"/>
  </g>

  <!-- Box 3 -->
  <g filter="url(#boxDrop)">
    <rect x="148" y="314" width="324" height="80" rx="6" fill="url(#boxWhite)" stroke="#d8d0ea" stroke-width="2"/>
    <rect x="142" y="302" width="336" height="22" rx="5" fill="url(#boxLid)" stroke="#d0c6e5" stroke-width="2"/>
    <rect x="288" y="302" width="44" height="92" fill="url(#purpleRibbon)"/>
  </g>

  <!-- Box 2 -->
  <g filter="url(#boxDrop)">
    <rect x="176" y="232" width="268" height="70" rx="6" fill="url(#boxWhite)" stroke="#d8d0ea" stroke-width="2"/>
    <rect x="170" y="220" width="280" height="20" rx="5" fill="url(#boxLid)" stroke="#d0c6e5" stroke-width="2"/>
    <rect x="290" y="220" width="40" height="82" fill="url(#purpleRibbon)"/>
  </g>

  <!-- Box 1 (Top, Smallest) -->
  <g filter="url(#boxDrop)">
    <rect x="204" y="156" width="212" height="64" rx="6" fill="url(#boxWhite)" stroke="#d8d0ea" stroke-width="2"/>
    <rect x="198" y="144" width="224" height="20" rx="5" fill="url(#boxLid)" stroke="#d0c6e5" stroke-width="2"/>
    <rect x="292" y="144" width="36" height="76" fill="url(#purpleRibbon)"/>
    <!-- Purple Satin Bow on Top -->
    <path d="M 310 144 C 272 108 242 126 268 144 C 282 152 300 148 310 144 Z" fill="url(#purpleRibbon)" stroke="#4c2d85" stroke-width="1.5"/>
    <path d="M 310 144 C 348 108 378 126 352 144 C 338 152 320 148 310 144 Z" fill="url(#purpleRibbon)" stroke="#4c2d85" stroke-width="1.5"/>
    <path d="M 304 144 L 278 175 L 294 176 L 310 148 Z" fill="#5e3b9e"/>
    <path d="M 316 144 L 342 175 L 326 176 L 310 148 Z" fill="#5e3b9e"/>
    <circle cx="310" cy="144" r="10" fill="#7950C8" stroke="#4c2d85" stroke-width="1.5"/>
    <!-- Kraft Gift Tag -->
    <g transform="translate(332, 148) rotate(18)">
      <path d="M 0 4 L 12 0 L 58 0 L 58 26 L 12 26 L 0 22 Z" fill="url(#kraftTag)" stroke="#9a713c" stroke-width="1.2"/>
      <circle cx="10" cy="13" r="2.5" fill="#ffffff"/>
    </g>
  </g>

  <!-- Secondary Purple Ribbon Bow on Box 3 -->
  <g transform="translate(310, 302)">
    <path d="M 0 0 C -26 -24 -48 -12 -28 0 C -18 5 -6 3 0 0 Z" fill="url(#purpleRibbon)" stroke="#4c2d85" stroke-width="1.2"/>
    <path d="M 0 0 C 26 -24 48 -12 28 0 C 18 5 6 3 0 0 Z" fill="url(#purpleRibbon)" stroke="#4c2d85" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="7" fill="#7950C8" stroke="#4c2d85" stroke-width="1.2"/>
  </g>

  <!-- Handcrafted Wooden Puzzles Beside Gift Stack -->
  <!-- Interlocking Wooden Burr Cube -->
  <g transform="translate(555, 425)" filter="url(#boxDrop)">
    <rect x="-26" y="-26" width="52" height="52" rx="4" fill="url(#woodLight)" stroke="#6d4222" stroke-width="2"/>
    <rect x="-44" y="-12" width="88" height="24" rx="3" fill="url(#woodBurr)" stroke="#4b2c15" stroke-width="2"/>
    <rect x="-12" y="-44" width="24" height="88" rx="3" fill="url(#woodLight)" stroke="#6d4222" stroke-width="2"/>
    <rect x="-12" y="-12" width="24" height="24" fill="url(#woodBurr)" stroke="#4b2c15" stroke-width="1.5"/>
  </g>

  <!-- Puzzle Box Cube -->
  <g transform="translate(658, 438)" filter="url(#boxDrop)">
    <polygon points="-42,-28 0,-48 42,-28 0,-8" fill="#ebd0a3" stroke="#6d4222" stroke-width="2"/>
    <polygon points="-42,-28 0,-8 0,42 -42,22" fill="url(#woodLight)" stroke="#6d4222" stroke-width="2"/>
    <polygon points="42,-28 0,-8 0,42 42,22" fill="url(#woodBurr)" stroke="#4b2c15" stroke-width="2"/>
    <path d="M 0 -8 L 0 42" stroke="#4b2c15" stroke-width="2"/>
    <circle cx="21" cy="17" r="7" fill="none" stroke="#ebd0a3" stroke-width="1.8" opacity="0.6"/>
  </g>
</svg>
