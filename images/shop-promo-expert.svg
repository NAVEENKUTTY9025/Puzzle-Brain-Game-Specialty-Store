<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="expBg" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#2a1f44"/>
      <stop offset="55%" stop-color="#141120"/>
      <stop offset="100%" stop-color="#09080f"/>
    </radialGradient>
    <linearGradient id="steelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="45%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="brassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="darkWoodBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c4f2b"/>
      <stop offset="100%" stop-color="#3b200d"/>
    </linearGradient>
    <linearGradient id="obsidianFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090814"/>
    </linearGradient>
    <filter id="expShadow" x="-20%" y="-20%" width="145%" height="145%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Moody Slate Surface -->
  <rect width="800" height="600" fill="url(#expBg)"/>
  <ellipse cx="400" cy="340" rx="340" ry="70" fill="#1e1a2e" stroke="#7950C8" stroke-opacity="0.22" stroke-width="2"/>

  <!-- Ornate Japanese-style Puzzle Box (Center-Left, upper-middle zone) -->
  <g transform="translate(260, 185)" filter="url(#expShadow)">
    <!-- Top face -->
    <polygon points="0,-55 110,-15 0,25 -110,-15" fill="#9a6437" stroke="#2c1708" stroke-width="2"/>
    <!-- Left face -->
    <polygon points="-110,-15 0,25 0,130 -110,90" fill="url(#darkWoodBox)" stroke="#2c1708" stroke-width="2"/>
    <!-- Right face -->
    <polygon points="110,-15 0,25 0,130 110,90" fill="#4f2d14" stroke="#2c1708" stroke-width="2"/>
    <!-- Geometric inlay lines -->
    <g stroke="#e3be8a" stroke-width="1.6" opacity="0.72" fill="none">
      <polygon points="-85,10 -25,32 -25,95 -85,73"/>
      <line x1="-85" y1="41" x2="-25" y2="63"/>
      <line x1="-55" y1="21" x2="-55" y2="84"/>
      <circle cx="55" cy="58" r="24"/>
      <polygon points="55,34 79,58 55,82 31,58"/>
    </g>
    <!-- Brass lock pin -->
    <circle cx="16" cy="48" r="5" fill="url(#brassGrad)"/>
  </g>

  <!-- Polyhedral Metal Puzzle (Right) -->
  <g transform="translate(530, 210)" filter="url(#expShadow)">
    <polygon points="0,-82 78,-26 48,66 -48,66 -78,-26" fill="url(#steelGrad)" stroke="#1e293b" stroke-width="2.5"/>
    <polygon points="0,-48 46,-15 28,39 -28,39 -46,-15" fill="url(#obsidianFace)" stroke="#c4b5fd" stroke-width="1.5"/>
    <line x1="0" y1="-82" x2="0" y2="-48" stroke="#1e293b" stroke-width="2"/>
    <line x1="78" y1="-26" x2="46" y2="-15" stroke="#1e293b" stroke-width="2"/>
    <line x1="48" y1="66" x2="28" y2="39" stroke="#1e293b" stroke-width="2"/>
    <line x1="-48" y1="66" x2="-28" y2="39" stroke="#1e293b" stroke-width="2"/>
    <line x1="-78" y1="-26" x2="-46" y2="-15" stroke="#1e293b" stroke-width="2"/>
  </g>

  <!-- Interlocking Steel & Brass Disentanglement Rings (Center-Front above text zone) -->
  <g transform="translate(410, 325)" filter="url(#expShadow)">
    <circle cx="-135" cy="0" r="38" fill="none" stroke="url(#brassGrad)" stroke-width="10"/>
    <circle cx="-90" cy="12" r="38" fill="none" stroke="url(#steelGrad)" stroke-width="10"/>
    <circle cx="-48" cy="-4" r="34" fill="none" stroke="url(#brassGrad)" stroke-width="9"/>
    <path d="M 45 -22 L 125 -22 C 145 -22 145 18 125 18 L 65 18 C 45 18 45 -10 65 -10 L 105 -10" fill="none" stroke="url(#steelGrad)" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
