<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="MindPiece Customer Support and Puzzle Concierge Desk">
  <defs>
    <linearGradient id="ch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1635"/>
      <stop offset="55%" stop-color="#291e47"/>
      <stop offset="100%" stop-color="#140f24"/>
    </linearGradient>
    <radialGradient id="ch-glow" cx="50%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#9b7ad9" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#7950C8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#7950C8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ch-desk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d8b58b"/>
      <stop offset="22%" stop-color="#c39765"/>
      <stop offset="100%" stop-color="#9b6e3f"/>
    </linearGradient>
    <linearGradient id="ch-desk-edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7d532b"/>
      <stop offset="50%" stop-color="#95673a"/>
      <stop offset="100%" stop-color="#6b4522"/>
    </linearGradient>
    <linearGradient id="ch-piece-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="45%" stop-color="#7950C8"/>
      <stop offset="100%" stop-color="#4e2e8c"/>
    </linearGradient>
    <linearGradient id="ch-piece-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="ch-tablet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#33294d"/>
      <stop offset="100%" stop-color="#19132b"/>
    </linearGradient>
    <linearGradient id="ch-screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#efeafc"/>
    </linearGradient>
    <linearGradient id="ch-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b62d9"/>
      <stop offset="100%" stop-color="#623bae"/>
    </linearGradient>
    <linearGradient id="ch-envelope" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdf9"/>
      <stop offset="100%" stop-color="#eae3f7"/>
    </linearGradient>
    <linearGradient id="ch-mug" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ec4b6"/>
      <stop offset="65%" stop-color="#159a8e"/>
      <stop offset="100%" stop-color="#0d6e66"/>
    </linearGradient>
    <linearGradient id="ch-brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="ch-shadow" x="-15%" y="-15%" width="135%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0b0716" flood-opacity="0.38"/>
    </filter>
    <filter id="ch-soft" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#2b1607" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Studio Backdrop -->
  <rect width="800" height="600" fill="url(#ch-bg)"/>
  <circle cx="400" cy="240" r="320" fill="url(#ch-glow)"/>

  <!-- Subtle Geometric Studio Halo Rings -->
  <circle cx="400" cy="215" r="195" fill="none" stroke="#9b7ad9" stroke-width="1.2" stroke-opacity="0.16" stroke-dasharray="6 10"/>
  <circle cx="400" cy="215" r="245" fill="none" stroke="#9b7ad9" stroke-width="1" stroke-opacity="0.09"/>

  <!-- Subtle Floating Studio Dots -->
  <g fill="#c4b5fd" opacity="0.25">
    <circle cx="130" cy="115" r="4"/>
    <circle cx="170" cy="145" r="2.5"/>
    <circle cx="670" cy="110" r="4"/>
    <circle cx="635" cy="150" r="2.5"/>
    <circle cx="145" cy="270" r="3"/>
    <circle cx="660" cy="260" r="3"/>
  </g>

  <!-- Warm Oak Concierge Desk -->
  <path d="M 40 430 L 760 430 L 800 545 L 0 545 Z" fill="url(#ch-desk)"/>
  <rect x="0" y="545" width="800" height="55" fill="url(#ch-desk-edge)"/>
  <!-- Desk Surface Highlight -->
  <line x1="60" y1="432" x2="740" y2="432" stroke="#f0d7b6" stroke-width="2" stroke-opacity="0.55"/>

  <!-- Interlocking Collaboration Puzzle Pieces Above Desk -->
  <g filter="url(#ch-shadow)">
    <!-- Left Amethyst Piece -->
    <g transform="translate(272, 102) rotate(-6)">
      <path d="M 0,18 Q 0,0 18,0 L 52,0 C 52,-18 78,-18 78,0 L 112,0 Q 130,0 130,18 L 130,52 C 150,52 150,82 130,82 L 130,116 Q 130,134 112,134 L 78,134 C 78,116 52,116 52,134 L 18,134 Q 0,134 0,116 L 0,82 C -18,82 -18,52 0,52 Z"
            fill="url(#ch-piece-purple)" stroke="#d8c6fc" stroke-width="2.5"/>
      <path d="M 16,18 L 106,18" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.32"/>
    </g>

    <!-- Right Amber Piece Snapping In -->
    <g transform="translate(410, 92) rotate(5)">
      <path d="M 0,18 Q 0,0 18,0 L 52,0 C 52,-18 78,-18 78,0 L 112,0 Q 130,0 130,18 L 130,52 C 148,52 148,82 130,82 L 130,116 Q 130,134 112,134 L 78,134 C 78,116 52,116 52,134 L 18,134 Q 0,134 0,116 L 0,82 C 18,82 18,52 0,52 Z"
            fill="url(#ch-piece-gold)" stroke="#fef3c7" stroke-width="2.5"/>
      <path d="M 20,18 L 110,18" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.38"/>
    </g>

    <!-- Connection Spark Lines -->
    <g stroke="#fde68a" stroke-width="3" stroke-linecap="round">
      <line x1="402" y1="82" x2="402" y2="66"/>
      <line x1="383" y1="90" x2="372" y2="78"/>
      <line x1="421" y1="90" x2="432" y2="78"/>
    </g>
  </g>

  <!-- Central Desk Support Display Console -->
  <g filter="url(#ch-shadow)">
    <!-- Stand Neck & Base -->
    <rect x="382" y="428" width="36" height="32" rx="4" fill="#231a3a"/>
    <ellipse cx="400" cy="462" rx="68" ry="11" fill="#1b142d"/>
    <ellipse cx="400" cy="459" rx="62" ry="8" fill="#352954"/>

    <!-- Tablet Chassis -->
    <rect x="275" y="268" width="250" height="168" rx="18" fill="url(#ch-tablet)" stroke="#5b4591" stroke-width="2.5"/>
    <!-- Inner Screen -->
    <rect x="289" y="282" width="222" height="140" rx="11" fill="url(#ch-screen)"/>

    <!-- Support Header Bar Inside Screen -->
    <rect x="289" y="282" width="222" height="34" rx="11" fill="#ede8fa"/>
    <rect x="289" y="302" width="222" height="14" fill="#ede8fa"/>
    <circle cx="310" cy="299" r="6" fill="#10b981"/>
    <rect x="325" y="294" width="88" height="10" rx="5" fill="#7950C8" opacity="0.85"/>
    <circle cx="486" cy="299" r="8" fill="#7950C8" opacity="0.2"/>
    <circle cx="486" cy="299" r="3.5" fill="#7950C8"/>

    <!-- Chat Bubbles Inside Screen -->
    <rect x="306" y="328" width="138" height="32" rx="10" fill="url(#ch-card)"/>
    <rect x="319" y="338" width="76" height="5" rx="2.5" fill="#ffffff" opacity="0.9"/>
    <rect x="319" y="348" width="104" height="4" rx="2" fill="#e9d5ff" opacity="0.85"/>

    <rect x="356" y="369" width="138" height="34" rx="10" fill="#f3efff" stroke="#d8ccf5" stroke-width="1.5"/>
    <rect x="370" y="380" width="92" height="5" rx="2.5" fill="#4c1d95" opacity="0.7"/>
    <rect x="370" y="390" width="64" height="4" rx="2" fill="#7950C8" opacity="0.55"/>

    <!-- Helpful Headset Badge Overlapping Corner -->
    <g transform="translate(495, 258)">
      <circle cx="0" cy="0" r="24" fill="#7950C8" stroke="#ffffff" stroke-width="3"/>
      <!-- Clean Headset Vector Icon -->
      <path d="M -10,1 C -10,-7 10,-7 10,1" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
      <rect x="-13" y="0" width="5" height="9" rx="2.5" fill="#ffffff"/>
      <rect x="8" y="0" width="5" height="9" rx="2.5" fill="#ffffff"/>
      <path d="M 10,8 Q 8,14 1,14" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Left Desk Props: Envelope Card & Warm Mug -->
  <g filter="url(#ch-soft)">
    <!-- Sealed Support Letter / Envelope -->
    <g transform="translate(112, 424) rotate(-5)">
      <rect x="0" y="0" width="138" height="90" rx="10" fill="url(#ch-envelope)" stroke="#d7ccf0" stroke-width="2"/>
      <path d="M 4,6 L 69,52 L 134,6" fill="none" stroke="#cbbbe9" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- Wax Seal with Puzzle Accent -->
      <circle cx="69" cy="48" r="14" fill="#7950C8" stroke="#ffffff" stroke-width="2"/>
      <path d="M 64,44 h 10 v 8 h -10 z" fill="#fde68a"/>
      <circle cx="69" cy="43" r="2.6" fill="#fde68a"/>
    </g>

    <!-- Ceramic Mug with Puzzle Emblem -->
    <g transform="translate(162, 336)">
      <!-- Steam Curves -->
      <path d="M 22,-10 Q 17,-22 24,-32" fill="none" stroke="#e9d5ff" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
      <path d="M 38,-12 Q 33,-25 41,-36" fill="none" stroke="#e9d5ff" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
      <!-- Handle -->
      <path d="M 58,18 C 76,18 76,50 58,50" fill="none" stroke="#159a8e" stroke-width="8" stroke-linecap="round"/>
      <!-- Cup Body -->
      <rect x="0" y="6" width="60" height="64" rx="10" fill="url(#ch-mug)"/>
      <ellipse cx="30" cy="6" rx="30" ry="7" fill="#5eead4" opacity="0.65"/>
      <ellipse cx="30" cy="6" rx="24" ry="4.5" fill="#4b2c1a"/>
      <!-- White Puzzle Mark on Mug -->
      <rect x="21" y="29" width="18" height="18" rx="3" fill="#ffffff" opacity="0.92"/>
      <circle cx="30" cy="28" r="4" fill="#ffffff" opacity="0.92"/>
      <circle cx="40" cy="38" r="4" fill="#ffffff" opacity="0.92"/>
    </g>
  </g>

  <!-- Right Desk Props: Replacement Piece Kit Box & Magnifier -->
  <g filter="url(#ch-soft)">
    <!-- Replacement Puzzle Care Box -->
    <g transform="translate(555, 360) rotate(4)">
      <rect x="0" y="18" width="124" height="92" rx="10" fill="#5e3b9e" stroke="#a78bfa" stroke-width="2"/>
      <rect x="-4" y="0" width="132" height="26" rx="7" fill="#7950C8" stroke="#c4b5fd" stroke-width="2"/>
      <!-- Ribbon -->
      <rect x="52" y="0" width="20" height="110" fill="#f59e0b"/>
      <rect x="52" y="0" width="20" height="26" fill="#fbbf24"/>
      <!-- White Label Card -->
      <rect x="18" y="42" width="88" height="44" rx="6" fill="#ffffff"/>
      <rect x="28" y="53" width="46" height="6" rx="3" fill="#7950C8"/>
      <rect x="28" y="65" width="64" height="5" rx="2.5" fill="#a198b8"/>
      <circle cx="90" cy="61" r="8" fill="#10b981"/>
      <path d="M 86,61 L 89,64 L 95,58" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Brass Desk Concierge Bell -->
    <g transform="translate(546, 444)">
      <ellipse cx="30" cy="34" rx="34" ry="8" fill="#231a3a"/>
      <path d="M 4,32 C 4,10 56,10 56,32 Z" fill="url(#ch-brass)"/>
      <path d="M 14,19 Q 22,12 34,14" fill="none" stroke="#fef3c7" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
      <rect x="26" y="4" width="8" height="6" rx="3" fill="#fef3c7"/>
    </g>
  </g>
</svg>
