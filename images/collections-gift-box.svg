<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Curated Puzzle Gift Box Collection</title>
  <desc>Luxury open puzzle gift box tied with purple satin ribbon containing wooden burr puzzle, colorful jigsaw pieces, brass teaser, and gift card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f5fc"/>
      <stop offset="55%" stop-color="#ede6fb"/>
      <stop offset="100%" stop-color="#dfd3f8"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ece5fa"/>
    </linearGradient>
    <linearGradient id="boxOuter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a223d"/>
      <stop offset="100%" stop-color="#14101f"/>
    </linearGradient>
    <linearGradient id="boxInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3ecff"/>
      <stop offset="100%" stop-color="#e2d5fb"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9b7ad9"/>
      <stop offset="50%" stop-color="#7950C8"/>
      <stop offset="100%" stop-color="#5e3b9e"/>
    </linearGradient>
    <linearGradient id="woodLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e3b778"/>
      <stop offset="100%" stop-color="#c38842"/>
    </linearGradient>
    <linearGradient id="woodDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9e632b"/>
      <stop offset="100%" stop-color="#693d16"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5d57a"/>
      <stop offset="55%" stop-color="#d4a024"/>
      <stop offset="100%" stop-color="#94680f"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#2d1a52" flood-opacity="0.22"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1e1338" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="150" cy="110" r="140" fill="#9b7ad9" opacity="0.1"/>
  <circle cx="670" cy="140" r="120" fill="#7950C8" opacity="0.08"/>

  <!-- Table Surface -->
  <path d="M0 400 L800 400 L800 600 L0 600 Z" fill="url(#table)"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#d5c6f3" stroke-width="2"/>

  <!-- Box Ground Shadow -->
  <ellipse cx="400" cy="482" rx="255" ry="42" fill="#2d1a52" opacity="0.16"/>

  <!-- Open Gift Box Lid Behind -->
  <g transform="translate(155, 88)" filter="url(#shadow)">
    <rect x="0" y="0" width="490" height="190" rx="16" fill="url(#boxOuter)" stroke="#473869" stroke-width="2"/>
    <rect x="14" y="14" width="462" height="162" rx="10" fill="#1e182e" stroke="#7950C8" stroke-width="1.5" stroke-opacity="0.5"/>
    <!-- Satin Ribbon Across Lid -->
    <rect x="218" y="0" width="54" height="190" fill="url(#ribbon)"/>
    <!-- MindPiece Gold Foil Monogram Inside Lid -->
    <g transform="translate(245, 76)">
      <circle cx="0" cy="0" r="34" fill="#181226" stroke="#e9c86b" stroke-width="2"/>
      <path d="M-12,-14 H12 V-4 A5,5 0 0,1 17,1 A5,5 0 0,1 12,6 V14 H-12 V6 A5,5 0 0,0 -7,1 A5,5 0 0,0 -12,-4 Z" fill="url(#ribbon)" stroke="#f5d57a" stroke-width="1.5"/>
    </g>
    <text x="245" y="138" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" letter-spacing="3" fill="#f5d57a">MINDPIECE</text>
    <text x="245" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" letter-spacing="2.5" fill="#cbb7f3">CURATED GIFT EDITION</text>
  </g>

  <!-- Gift Box Main Base -->
  <g transform="translate(140, 240)" filter="url(#shadow)">
    <!-- Box Tray Rim & Tissue Lining -->
    <rect x="0" y="0" width="520" height="232" rx="16" fill="url(#boxOuter)" stroke="#473869" stroke-width="2"/>
    <rect x="16" y="16" width="488" height="145" rx="10" fill="url(#boxInner)"/>
    <!-- Tissue Paper Folds -->
    <path d="M16 115 Q90 88 175 110 T345 102 T504 118 L504 161 L16 161 Z" fill="#ffffff" opacity="0.72"/>
    <path d="M16 132 Q125 108 240 128 T504 126 L504 161 L16 161 Z" fill="#f9f6ff" opacity="0.9"/>

    <!-- Compartment Dividers Inside Tray -->
    <line x1="184" y1="22" x2="184" y2="154" stroke="#cab7f0" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="344" y1="22" x2="344" y2="154" stroke="#cab7f0" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Item 1: 3D Wooden Burr Star Puzzle (Left Compartment) -->
    <g transform="translate(100, 88)" filter="url(#softShadow)">
      <polygon points="0,-46 18,-36 18,36 0,46 -18,36 -18,-36" fill="url(#woodDark)"/>
      <rect x="-46" y="-14" width="92" height="28" rx="4" fill="url(#woodLight)" stroke="#8c5420" stroke-width="1.5"/>
      <rect x="-14" y="-46" width="28" height="92" rx="4" fill="url(#woodLight)" stroke="#8c5420" stroke-width="1.5"/>
      <polygon points="-34,-24 24,34 34,24 -24,-34" fill="#d39a54" stroke="#7d4818" stroke-width="1.2"/>
      <polygon points="34,-24 -24,34 -34,24 24,-34" fill="url(#woodDark)" stroke="#522d0c" stroke-width="1.2"/>
      <rect x="-12" y="-12" width="24" height="24" rx="2" fill="#f0c888" stroke="#8c5420" stroke-width="1.2"/>
    </g>

    <!-- Item 2: Interlocking Jigsaw Cluster (Center Compartment) -->
    <g transform="translate(264, 86)" filter="url(#softShadow)">
      <path d="M-42,-36 H-6 C-6,-44 6,-44 6,-36 H36 V-6 C44,-6 44,6 36,6 V36 H6 C6,28 -6,28 -6,36 H-42 V6 C-34,6 -34,-6 -42,-6 Z" fill="#7950C8" stroke="#ffffff" stroke-width="2"/>
      <path d="M-4,-42 H32 V-10 C24,-10 24,2 32,2 V28 H-4 C-4,20 -16,20 -16,28 H-40" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
      <path d="M-10,-8 H28 V24 C36,24 36,34 28,34 V40 H-10 V14 C-18,14 -18,2 -10,2 Z" transform="translate(12, 8)" fill="#f5b841" stroke="#ffffff" stroke-width="2"/>
      <path d="M-36,4 H-4 V38 H-36 V22 C-28,22 -28,12 -36,12 Z" fill="#34b3a0" stroke="#ffffff" stroke-width="2"/>
    </g>

    <!-- Item 3: Brass Cylinder Lock & Gift Card (Right Compartment) -->
    <g transform="translate(425, 86)" filter="url(#softShadow)">
      <!-- Gift Card Behind -->
      <g transform="rotate(8)">
        <rect x="-48" y="-44" width="96" height="62" rx="8" fill="#ffffff" stroke="#7950C8" stroke-width="2"/>
        <rect x="-48" y="-32" width="96" height="12" fill="url(#ribbon)"/>
        <text x="0" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#5e3b9e">GIFT VOUCHER</text>
      </g>
      <!-- Brass Metal Cylinder Brain Teaser -->
      <g transform="translate(-8, 16)">
        <ellipse cx="0" cy="-22" rx="22" ry="7" fill="#f7de8d"/>
        <rect x="-22" y="-22" width="44" height="40" fill="url(#brass)"/>
        <ellipse cx="0" cy="18" rx="22" ry="7" fill="#94680f"/>
        <line x1="-22" y1="-4" x2="22" y2="-4" stroke="#704d08" stroke-width="2"/>
        <line x1="-22" y1="6" x2="22" y2="6" stroke="#704d08" stroke-width="2"/>
        <circle cx="0" cy="1" r="5" fill="#4f3504"/>
      </g>
    </g>

    <!-- Front Face of Gift Box -->
    <rect x="0" y="166" width="520" height="66" rx="12" fill="url(#boxOuter)"/>
    <rect x="0" y="166" width="520" height="10" fill="#3b2f57"/>
    <!-- Vertical Ribbon Around Box Front -->
    <rect x="233" y="166" width="54" height="66" fill="url(#ribbon)"/>
    <!-- Horizontal Ribbon Wrap -->
    <rect x="0" y="189" width="520" height="22" fill="url(#ribbon)" opacity="0.95"/>

    <!-- Satin Bow Knot at Center Front -->
    <g transform="translate(260, 200)" filter="url(#softShadow)">
      <path d="M-8,0 C-42,-34 -68,-10 -52,12 C-38,28 -14,10 -6,4 Z" fill="#9b7ad9" stroke="#5e3b9e" stroke-width="1.5"/>
      <path d="M8,0 C42,-34 68,-10 52,12 C38,28 14,10 6,4 Z" fill="#9b7ad9" stroke="#5e3b9e" stroke-width="1.5"/>
      <path d="M-12,8 L-34,48 L-16,44 L-4,12 Z" fill="url(#ribbon)"/>
      <path d="M12,8 L34,48 L16,44 L4,12 Z" fill="url(#ribbon)"/>
      <rect x="-11" y="-10" width="22" height="20" rx="6" fill="#7950C8" stroke="#d9c6fa" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Loose Accent Puzzle Pieces on Table -->
  <g transform="translate(105, 455) rotate(-18)" filter="url(#softShadow)">
    <path d="M0,0 H24 C24,-8 34,-8 34,0 H54 V24 C62,24 62,34 54,34 V54 H30 C30,46 20,46 20,54 H0 V30 C8,30 8,20 0,20 Z" fill="#7950C8" stroke="#ffffff" stroke-width="2"/>
  </g>
  <g transform="translate(650, 448) rotate(16)" filter="url(#softShadow)">
    <path d="M0,0 H22 C22,-7 32,-7 32,0 H50 V22 C57,22 57,32 50,32 V50 H28 C28,43 18,43 18,50 H0 V28 C7,28 7,18 0,18 Z" fill="#f5b841" stroke="#ffffff" stroke-width="2"/>
  </g>
</svg>
