<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="colBg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#2c1f4d"/>
      <stop offset="55%" stop-color="#171226"/>
      <stop offset="100%" stop-color="#0b0814"/>
    </radialGradient>
    <linearGradient id="pedestalTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f5fc"/>
      <stop offset="100%" stop-color="#d8cff0"/>
    </linearGradient>
    <linearGradient id="pedestalSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7950C8"/>
      <stop offset="100%" stop-color="#3e256d"/>
    </linearGradient>
    <linearGradient id="oak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ebc694"/>
      <stop offset="100%" stop-color="#b47e42"/>
    </linearGradient>
    <linearGradient id="walnut" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c4f2b"/>
      <stop offset="100%" stop-color="#42240e"/>
    </linearGradient>
    <linearGradient id="jigsawTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="jigsawPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="jigsawAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="metalSilver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="colShadow" x="-20%" y="-20%" width="145%" height="145%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#04020a" flood-opacity="0.65"/>
    </filter>
    <filter id="colGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <!-- Studio Backdrop -->
  <rect width="800" height="600" fill="url(#colBg)"/>
  <circle cx="400" cy="240" r="230" fill="#7950C8" opacity="0.22" filter="url(#colGlow)"/>

  <!-- Tiered Display Pedestals -->
  <g filter="url(#colShadow)">
    <!-- Back wide shelf -->
    <rect x="90" y="395" width="620" height="40" rx="8" fill="url(#pedestalSide)"/>
    <ellipse cx="400" cy="395" rx="310" ry="30" fill="url(#pedestalTop)" stroke="#c4b5fd" stroke-width="2"/>
    <!-- Center raised plinth -->
    <rect x="260" y="305" width="280" height="90" rx="8" fill="url(#pedestalSide)"/>
    <ellipse cx="400" cy="305" rx="140" ry="22" fill="url(#pedestalTop)" stroke="#c4b5fd" stroke-width="2"/>
  </g>

  <!-- Center Hero: 3D Wooden Burr Cube -->
  <g transform="translate(400, 210)" filter="url(#colShadow)">
    <rect x="-54" y="-54" width="108" height="108" rx="8" fill="url(#walnut)" stroke="#2b1607" stroke-width="2"/>
    <rect x="-86" y="-20" width="172" height="40" rx="6" fill="url(#oak)" stroke="#5e3619" stroke-width="2"/>
    <rect x="-20" y="-86" width="40" height="172" rx="6" fill="url(#walnut)" stroke="#2b1607" stroke-width="2"/>
    <rect x="-20" y="-20" width="40" height="40" rx="4" fill="url(#jigsawPurple)" stroke="#2e1065" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#fde68a"/>
  </g>

  <!-- Left Showcase: Colorful Jigsaw Cluster -->
  <g transform="translate(135, 258) rotate(-10)" filter="url(#colShadow)">
    <path d="M 0 0 L 58 0 L 58 22 C 70 22 70 42 58 42 L 58 64 L 36 64 C 36 76 16 76 16 64 L 0 64 Z" fill="url(#jigsawPurple)" stroke="#ffffff" stroke-width="2.5"/>
    <path d="M 60 0 L 118 0 L 118 64 L 96 64 C 96 52 76 52 76 64 L 60 64 L 60 42 C 72 42 72 22 60 22 Z" fill="url(#jigsawTeal)" stroke="#ffffff" stroke-width="2.5"/>
    <path d="M 0 66 L 16 66 C 16 78 36 78 36 66 L 58 66 L 58 88 C 46 88 46 108 58 108 L 58 130 L 0 130 Z" fill="url(#jigsawAmber)" stroke="#ffffff" stroke-width="2.5"/>
  </g>

  <!-- Right Showcase: Walnut Chess Knight & Metal Brain Teaser Rings -->
  <g transform="translate(615, 290)" filter="url(#colShadow)">
    <!-- Chess King / Pawn Silhouette -->
    <ellipse cx="0" cy="72" rx="34" ry="10" fill="#2b1607"/>
    <path d="M -26 70 L -14 -12 L 14 -12 L 26 70 Z" fill="url(#walnut)" stroke="#1e0e04" stroke-width="2"/>
    <rect x="-20" y="-20" width="40" height="10" rx="4" fill="url(#oak)" stroke="#42240e" stroke-width="1.5"/>
    <circle cx="0" cy="-38" r="20" fill="url(#walnut)" stroke="#1e0e04" stroke-width="2"/>
    <path d="M -8 -66 L 8 -66 M 0 -74 L 0 -58" stroke="#fde68a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Foreground Interlocking Metal Rings & Mini Dice -->
  <g transform="translate(260, 445)" filter="url(#colShadow)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="url(#metalSilver)" stroke-width="8"/>
    <circle cx="34" cy="8" r="28" fill="none" stroke="url(#jigsawAmber)" stroke-width="8"/>
  </g>
  <g transform="translate(515, 430) rotate(12)" filter="url(#colShadow)">
    <rect x="-22" y="-22" width="44" height="44" rx="8" fill="url(#oak)" stroke="#5e3619" stroke-width="2"/>
    <circle cx="-9" cy="-9" r="3.5" fill="#42240e"/>
    <circle cx="9" cy="-9" r="3.5" fill="#42240e"/>
    <circle cx="0" cy="0" r="3.5" fill="#42240e"/>
    <circle cx="-9" cy="9" r="3.5" fill="#42240e"/>
    <circle cx="9" cy="9" r="3.5" fill="#42240e"/>
  </g>
</svg>
