<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="MindPiece Custom Puzzle Consultation and Studio Craft Table">
  <defs>
    <linearGradient id="cs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6f2fd"/>
      <stop offset="55%" stop-color="#ebe3fb"/>
      <stop offset="100%" stop-color="#ded2f7"/>
    </linearGradient>
    <radialGradient id="cs-glow" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#d8cbf4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cs-table" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c99b68"/>
      <stop offset="55%" stop-color="#a87643"/>
      <stop offset="100%" stop-color="#7c5229"/>
    </linearGradient>
    <linearGradient id="cs-mat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c204a"/>
      <stop offset="100%" stop-color="#1b1331"/>
    </linearGradient>
    <linearGradient id="cs-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6b42b8"/>
    </linearGradient>
    <linearGradient id="cs-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="cs-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cs-coral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="cs-brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="cs-shadow" x="-15%" y="-15%" width="135%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#241547" flood-opacity="0.22"/>
    </filter>
    <filter id="cs-soft" x="-15%" y="-15%" width="135%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1a0d30" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Studio Canvas Backdrop -->
  <rect width="800" height="600" fill="url(#cs-bg)"/>
  <circle cx="400" cy="290" r="310" fill="url(#cs-glow)"/>

  <!-- Subtle Background Decorative Rings -->
  <circle cx="400" cy="300" r="245" fill="none" stroke="#7950C8" stroke-width="1.2" stroke-opacity="0.14"/>
  <circle cx="400" cy="300" r="285" fill="none" stroke="#7950C8" stroke-width="1" stroke-opacity="0.08" stroke-dasharray="8 8"/>

  <!-- Walnut Consultation Worktable Top -->
  <g filter="url(#cs-shadow)">
    <rect x="85" y="105" width="630" height="395" rx="28" fill="url(#cs-table)"/>
    <rect x="97" y="117" width="606" height="371" rx="20" fill="none" stroke="#e9c89d" stroke-width="1.5" stroke-opacity="0.4"/>
  </g>

  <!-- Central Purple Blueprint / Craft Mat -->
  <g filter="url(#cs-soft)">
    <rect x="175" y="148" width="420" height="295" rx="16" fill="url(#cs-mat)" stroke="#7950C8" stroke-width="2.5"/>
    <!-- Subtle Blueprint Grid Inside Mat -->
    <g stroke="#9b7ad9" stroke-width="0.8" stroke-opacity="0.18">
      <line x1="235" y1="148" x2="235" y2="443"/>
      <line x1="295" y1="148" x2="295" y2="443"/>
      <line x1="355" y1="148" x2="355" y2="443"/>
      <line x1="415" y1="148" x2="415" y2="443"/>
      <line x1="475" y1="148" x2="475" y2="443"/>
      <line x1="535" y1="148" x2="535" y2="443"/>
      <line x1="175" y1="208" x2="595" y2="208"/>
      <line x1="175" y1="268" x2="595" y2="268"/>
      <line x1="175" y1="328" x2="595" y2="328"/>
      <line x1="175" y1="388" x2="595" y2="388"/>
    </g>

    <!-- Custom Collaborative Jigsaw / Tangram Specimen on Blueprint -->
    <g transform="translate(242, 185)">
      <!-- Board Tray Frame -->
      <rect x="-12" y="-12" width="244" height="224" rx="14" fill="#2f2252" stroke="#a78bfa" stroke-width="2"/>

      <!-- Row 1 Pieces -->
      <rect x="4" y="4" width="66" height="92" rx="6" fill="url(#cs-purple)"/>
      <circle cx="71" cy="50" r="10" fill="url(#cs-purple)"/>

      <rect x="74" y="4" width="72" height="92" rx="6" fill="url(#cs-teal)"/>
      <circle cx="110" cy="97" r="10" fill="url(#cs-teal)"/>

      <rect x="150" y="4" width="66" height="92" rx="6" fill="url(#cs-amber)"/>
      <circle cx="149" cy="50" r="10" fill="url(#cs-amber)"/>

      <!-- Row 2 Pieces -->
      <rect x="4" y="100" width="66" height="92" rx="6" fill="url(#cs-coral)"/>
      <circle cx="37" cy="99" r="10" fill="url(#cs-coral)"/>

      <rect x="74" y="100" width="72" height="92" rx="6" fill="url(#cs-purple)"/>
      <circle cx="73" cy="146" r="10" fill="url(#cs-purple)"/>

      <!-- Open Guide Slot -->
      <rect x="150" y="100" width="66" height="92" rx="6" fill="#1d1435" stroke="#fde68a" stroke-width="2" stroke-dasharray="5 4"/>
    </g>

    <!-- Floating Matching Piece Guided Toward Slot -->
    <g transform="translate(454, 294) rotate(-8)" filter="url(#cs-soft)">
      <rect x="0" y="0" width="68" height="90" rx="8" fill="url(#cs-teal)" stroke="#ffffff" stroke-width="2.5"/>
      <circle cx="34" cy="-2" r="10" fill="url(#cs-teal)"/>
      <circle cx="-1" cy="45" r="10" fill="url(#cs-teal)"/>
      <path d="M 14,16 L 52,16" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.45"/>
    </g>
  </g>

  <!-- Left Swatch Fan (Wood & Finish Options for Custom / Retail Orders) -->
  <g transform="translate(120, 326)" filter="url(#cs-soft)">
    <g transform="rotate(-18 28 112)">
      <rect x="0" y="0" width="56" height="128" rx="10" fill="#7950C8" stroke="#ffffff" stroke-width="2"/>
    </g>
    <g transform="rotate(-6 28 112)">
      <rect x="0" y="0" width="56" height="128" rx="10" fill="#14b8a6" stroke="#ffffff" stroke-width="2"/>
    </g>
    <g transform="rotate(8 28 112)">
      <rect x="0" y="0" width="56" height="128" rx="10" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
    </g>
    <g transform="rotate(22 28 112)">
      <rect x="0" y="0" width="56" height="128" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="12" y="16" width="32" height="32" rx="5" fill="#7950C8" opacity="0.22"/>
    </g>
    <circle cx="28" cy="112" r="7" fill="url(#cs-brass)" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Right Side Prop: Brass Magnifier & Inquiry Clipboard Note -->
  <g filter="url(#cs-soft)">
    <!-- White Spec Card on Right Edge -->
    <g transform="translate(556, 152) rotate(6)">
      <rect x="0" y="0" width="128" height="164" rx="12" fill="#ffffff" stroke="#e2d9f3" stroke-width="2"/>
      <rect x="34" y="-8" width="60" height="16" rx="5" fill="#7950C8"/>
      <rect x="18" y="28" width="64" height="8" rx="4" fill="#7950C8"/>
      <rect x="18" y="48" width="92" height="5" rx="2.5" fill="#cbd5e1"/>
      <rect x="18" y="61" width="84" height="5" rx="2.5" fill="#cbd5e1"/>
      <rect x="18" y="74" width="76" height="5" rx="2.5" fill="#cbd5e1"/>
      <!-- Mini Puzzle Checklist Marks -->
      <circle cx="26" cy="102" r="7" fill="#10b981"/>
      <path d="M 22,102 L 25,105 L 30,100" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
      <rect x="42" y="99" width="62" height="6" rx="3" fill="#475569"/>
      <circle cx="26" cy="126" r="7" fill="#10b981"/>
      <path d="M 22,126 L 25,129 L 30,124" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
      <rect x="42" y="123" width="54" height="6" rx="3" fill="#475569"/>
    </g>

    <!-- Studio Magnifier Resting Bottom Right -->
    <g transform="translate(566, 372) rotate(-28)">
      <rect x="-8" y="42" width="16" height="72" rx="8" fill="#482c15" stroke="#9e7242" stroke-width="2"/>
      <circle cx="0" cy="0" r="46" fill="#e0f2fe" fill-opacity="0.32" stroke="url(#cs-brass)" stroke-width="8"/>
      <path d="M -26,-20 Q -12,-34 10,-28" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.72"/>
    </g>
  </g>
</svg>
