<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="tableGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171422"/>
      <stop offset="55%" stop-color="#221d33"/>
      <stop offset="100%" stop-color="#110e1b"/>
    </linearGradient>
    <linearGradient id="spaceBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070516"/>
      <stop offset="45%" stop-color="#190e3d"/>
      <stop offset="100%" stop-color="#0a081e"/>
    </linearGradient>
    <radialGradient id="nebulaPurple" cx="38%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.88"/>
      <stop offset="35%" stop-color="#7950C8" stop-opacity="0.68"/>
      <stop offset="70%" stop-color="#4c1d95" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#190e3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaCyan" cx="68%" cy="38%" r="44%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.72"/>
      <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaPink" cx="54%" cy="68%" r="40%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#9333ea" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#190e3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planetGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="40%" stop-color="#c084fc"/>
      <stop offset="80%" stop-color="#5b21b6"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e9d5ff" stop-opacity="0.1"/>
      <stop offset="30%" stop-color="#c4b5fd" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#fde68a" stop-opacity="0.65"/>
      <stop offset="80%" stop-color="#a78bfa" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#e9d5ff" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#04020a" flood-opacity="0.65"/>
    </filter>
    <filter id="pieceShadow" x="-20%" y="-20%" width="145%" height="145%">
      <feDropShadow dx="2" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <clipPath id="puzzleBoardClip">
      <rect x="85" y="55" width="600" height="450" rx="10"/>
    </clipPath>
    <clipPath id="loosePiece1Clip">
      <path d="M 650 385 L 690 385 C 690 373 704 371 704 385 L 745 385 L 745 422 C 758 422 760 438 745 438 L 745 475 L 704 475 C 704 488 690 488 690 475 L 650 475 L 650 438 C 637 438 637 422 650 422 Z"/>
    </clipPath>
    <clipPath id="loosePiece2Clip">
      <path d="M 555 475 L 595 475 C 595 462 610 462 610 475 L 648 475 L 648 512 C 635 512 635 527 648 527 L 648 562 L 610 562 C 610 574 595 574 595 562 L 555 562 L 555 527 C 567 527 567 512 555 512 Z"/>
    </clipPath>
  </defs>

  <!-- Tabletop background -->
  <rect width="800" height="600" fill="url(#tableGrad)"/>
  <circle cx="400" cy="300" r="380" fill="#7950C8" opacity="0.08" filter="url(#softGlow)"/>

  <!-- Main Jigsaw Puzzle Board -->
  <g filter="url(#cardShadow)">
    <rect x="85" y="55" width="600" height="450" rx="10" fill="#0d0a1a"/>
    <g clip-path="url(#puzzleBoardClip)">
      <rect x="85" y="55" width="600" height="450" fill="url(#spaceBase)"/>
      <!-- Nebula Clouds -->
      <ellipse cx="320" cy="270" rx="250" ry="170" fill="url(#nebulaPurple)" filter="url(#softGlow)"/>
      <ellipse cx="510" cy="210" rx="200" ry="150" fill="url(#nebulaCyan)" filter="url(#softGlow)"/>
      <ellipse cx="420" cy="370" rx="210" ry="130" fill="url(#nebulaPink)" filter="url(#softGlow)"/>

      <!-- Spiral Galaxy Glow -->
      <g transform="translate(275, 295) rotate(-24)">
        <ellipse cx="0" cy="0" rx="135" ry="44" fill="#a855f7" opacity="0.22" filter="url(#softGlow)"/>
        <ellipse cx="0" cy="0" rx="75" ry="22" fill="#e9d5ff" opacity="0.35" filter="url(#softGlow)"/>
        <circle cx="0" cy="0" r="16" fill="#fef3c7" opacity="0.9"/>
        <circle cx="0" cy="0" r="6" fill="#ffffff"/>
      </g>

      <!-- Ringed Cosmic Planet -->
      <g transform="translate(495, 225)">
        <circle cx="0" cy="0" r="64" fill="url(#planetGrad)"/>
        <path d="M -59 -18 Q 0 -30 59 -18" fill="none" stroke="#e9d5ff" stroke-width="5" opacity="0.22"/>
        <path d="M -63 6 Q 0 -8 63 6" fill="none" stroke="#fde68a" stroke-width="4" opacity="0.18"/>
        <path d="M -54 28 Q 0 18 54 28" fill="none" stroke="#7c3aed" stroke-width="6" opacity="0.28"/>
        <g transform="rotate(-18)">
          <ellipse cx="0" cy="2" rx="108" ry="24" fill="none" stroke="url(#ringGrad)" stroke-width="11"/>
          <ellipse cx="0" cy="2" rx="92" ry="19" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.35"/>
        </g>
      </g>

      <!-- Stars -->
      <g fill="#ffffff">
        <circle cx="135" cy="95" r="2.2" opacity="0.9"/>
        <circle cx="178" cy="145" r="1.4" opacity="0.7"/>
        <circle cx="220" cy="88" r="1.8" opacity="0.85"/>
        <circle cx="310" cy="112" r="2.5" opacity="0.95"/>
        <circle cx="375" cy="84" r="1.5" opacity="0.7"/>
        <circle cx="430" cy="128" r="2" opacity="0.85"/>
        <circle cx="605" cy="108" r="2.3" opacity="0.9"/>
        <circle cx="642" cy="162" r="1.6" opacity="0.75"/>
        <circle cx="148" cy="235" r="1.7" opacity="0.8"/>
        <circle cx="195" cy="390" r="2.1" opacity="0.9"/>
        <circle cx="132" cy="445" r="1.5" opacity="0.7"/>
        <circle cx="290" cy="430" r="2.4" opacity="0.9"/>
        <circle cx="365" cy="455" r="1.4" opacity="0.75"/>
        <circle cx="458" cy="422" r="2.2" opacity="0.85"/>
        <circle cx="568" cy="365" r="2.6" opacity="0.95"/>
        <circle cx="628" cy="312" r="1.8" opacity="0.8"/>
        <circle cx="635" cy="442" r="2" opacity="0.85"/>
        <circle cx="395" cy="220" r="1.6" opacity="0.8"/>
        <circle cx="240" cy="198" r="1.4" opacity="0.75"/>
        <circle cx="545" cy="125" r="1.5" opacity="0.8"/>
      </g>
      <!-- 4-point sparkle stars -->
      <g fill="#fef3c7" opacity="0.95">
        <path d="M 162 110 L 165 120 L 175 123 L 165 126 L 162 136 L 159 126 L 149 123 L 159 120 Z"/>
        <path d="M 615 268 L 617 276 L 625 278 L 617 280 L 615 288 L 613 280 L 605 278 L 613 276 Z"/>
        <path d="M 358 375 L 360 383 L 368 385 L 360 387 L 358 395 L 356 387 L 348 385 L 356 383 Z"/>
      </g>

      <!-- Missing corner puzzle cutout on bottom-right showing tabletop -->
      <path d="M 610 430 L 685 430 L 685 505 L 610 505 Z" fill="#171422"/>
      <path d="M 610 430 L 635 430 C 635 418 650 418 650 430 L 685 430 L 685 505 L 610 505 L 610 475 C 622 475 622 460 610 460 Z" fill="#110e1b"/>

      <!-- Jigsaw Cut Grid Lines (8x6 grid = 75x75 pieces) -->
      <g fill="none" stroke="#080512" stroke-width="2.1" stroke-opacity="0.78">
        <!-- Horizontal jigsaw lines -->
        <path d="M 85 130 L 115 130 C 115 119 130 119 130 130 L 190 130 C 190 141 205 141 205 130 L 265 130 C 265 119 280 119 280 130 L 340 130 C 340 141 355 141 355 130 L 415 130 C 415 119 430 119 430 130 L 490 130 C 490 141 505 141 505 130 L 565 130 C 565 119 580 119 580 130 L 640 130 C 640 141 655 141 655 130 L 685 130"/>
        <path d="M 85 205 L 115 205 C 115 216 130 216 130 205 L 190 205 C 190 194 205 194 205 205 L 265 205 C 265 216 280 216 280 205 L 340 205 C 340 194 355 194 355 205 L 415 205 C 415 216 430 216 430 205 L 490 205 C 490 194 505 194 505 205 L 565 205 C 565 216 580 216 580 205 L 640 205 C 640 194 655 194 655 205 L 685 205"/>
        <path d="M 85 280 L 115 280 C 115 269 130 269 130 280 L 190 280 C 190 291 205 291 205 280 L 265 280 C 265 269 280 269 280 280 L 340 280 C 340 291 355 291 355 280 L 415 280 C 415 269 430 269 430 280 L 490 280 C 490 291 505 291 505 280 L 565 280 C 565 269 580 269 580 280 L 640 280 C 640 291 655 291 655 280 L 685 280"/>
        <path d="M 85 355 L 115 355 C 115 366 130 366 130 355 L 190 355 C 190 344 205 344 205 355 L 265 355 C 265 366 280 366 280 355 L 340 355 C 340 344 355 344 355 355 L 415 355 C 415 366 430 366 430 355 L 490 355 C 490 344 505 344 505 355 L 565 355 C 565 366 580 366 580 355 L 640 355 C 640 344 655 344 655 355 L 685 355"/>
        <path d="M 85 430 L 115 430 C 115 419 130 419 130 430 L 190 430 C 190 441 205 441 205 430 L 265 430 C 265 419 280 419 280 430 L 340 430 C 340 441 355 441 355 430 L 415 430 C 415 419 430 419 430 430 L 490 430 C 490 441 505 441 505 430 L 565 430 C 565 419 580 419 580 430 L 610 430"/>
        <!-- Vertical jigsaw lines -->
        <path d="M 160 55 L 160 85 C 171 85 171 100 160 100 L 160 160 C 149 160 149 175 160 175 L 160 235 C 171 235 171 250 160 250 L 160 310 C 149 310 149 325 160 325 L 160 385 C 171 385 171 400 160 400 L 160 460 C 149 460 149 475 160 475 L 160 505"/>
        <path d="M 235 55 L 235 85 C 224 85 224 100 235 100 L 235 160 C 246 160 246 175 235 175 L 235 235 C 224 235 224 250 235 250 L 235 310 C 246 310 246 325 235 325 L 235 385 C 224 385 224 400 235 400 L 235 460 C 246 460 246 475 235 475 L 235 505"/>
        <path d="M 310 55 L 310 85 C 321 85 321 100 310 100 L 310 160 C 299 160 299 175 310 175 L 310 235 C 321 235 321 250 310 250 L 310 310 C 299 310 299 325 310 325 L 310 385 C 321 385 321 400 310 400 L 310 460 C 299 460 299 475 310 475 L 310 505"/>
        <path d="M 385 55 L 385 85 C 374 85 374 100 385 100 L 385 160 C 396 160 396 175 385 175 L 385 235 C 374 235 374 250 385 250 L 385 310 C 396 310 396 325 385 325 L 385 385 C 374 385 374 400 385 400 L 385 460 C 396 460 396 475 385 475 L 385 505"/>
        <path d="M 460 55 L 460 85 C 471 85 471 100 460 100 L 460 160 C 449 160 449 175 460 175 L 460 235 C 471 235 471 250 460 250 L 460 310 C 449 310 449 325 460 325 L 460 385 C 471 385 471 400 460 400 L 460 460 C 449 460 449 475 460 475 L 460 505"/>
        <path d="M 535 55 L 535 85 C 524 85 524 100 535 100 L 535 160 C 546 160 546 175 535 175 L 535 235 C 524 235 524 250 535 250 L 535 310 C 546 310 546 325 535 325 L 535 385 C 524 385 524 400 535 400 L 535 460 C 546 460 546 475 535 475 L 535 505"/>
        <path d="M 610 55 L 610 85 C 621 85 621 100 610 100 L 610 160 C 599 160 599 175 610 175 L 610 235 C 621 235 621 250 610 250 L 610 310 C 599 310 599 325 610 325 L 610 385 C 621 385 621 400 610 400 L 610 430"/>
      </g>
      <!-- Subtle specular edge highlight -->
      <rect x="85" y="55" width="600" height="450" rx="10" fill="none" stroke="#c4b5fd" stroke-width="1.5" stroke-opacity="0.3"/>
    </g>
  </g>

  <!-- Loose Puzzle Pieces on Table -->
  <g transform="translate(0, 0) rotate(-11 697 430)" filter="url(#pieceShadow)">
    <g clip-path="url(#loosePiece1Clip)">
      <rect x="630" y="365" width="140" height="140" fill="#2e1065"/>
      <circle cx="690" cy="425" r="45" fill="#9333ea" opacity="0.7" filter="url(#softGlow)"/>
      <circle cx="715" cy="415" r="2.2" fill="#ffffff"/>
      <circle cx="675" cy="445" r="1.8" fill="#fef3c7"/>
    </g>
    <path d="M 650 385 L 690 385 C 690 373 704 371 704 385 L 745 385 L 745 422 C 758 422 760 438 745 438 L 745 475 L 704 475 C 704 488 690 488 690 475 L 650 475 L 650 438 C 637 438 637 422 650 422 Z" fill="none" stroke="#c4b5fd" stroke-width="1.5" stroke-opacity="0.6"/>
  </g>

  <g transform="translate(8, 12) rotate(14 600 520)" filter="url(#pieceShadow)">
    <g clip-path="url(#loosePiece2Clip)">
      <rect x="540" y="455" width="130" height="130" fill="#1e1b4b"/>
      <circle cx="600" cy="518" r="42" fill="#38bdf8" opacity="0.5" filter="url(#softGlow)"/>
      <circle cx="595" cy="500" r="2" fill="#ffffff"/>
      <circle cx="618" cy="532" r="2" fill="#fef3c7"/>
    </g>
    <path d="M 555 475 L 595 475 C 595 462 610 462 610 475 L 648 475 L 648 512 C 635 512 635 527 648 527 L 648 562 L 610 562 C 610 574 595 574 595 562 L 555 562 L 555 527 C 567 527 567 512 555 512 Z" fill="none" stroke="#c4b5fd" stroke-width="1.5" stroke-opacity="0.55"/>
  </g>
</svg>
