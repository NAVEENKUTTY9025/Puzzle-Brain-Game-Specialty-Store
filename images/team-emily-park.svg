<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520" role="img" aria-labelledby="title desc">
  <title id="title">Emily Park — Customer Experience</title>
  <desc>Editorial studio portrait illustration of Emily Park wearing a soft purple cardigan over a crisp white collar.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbf9ff"/>
      <stop offset="55%" stop-color="#ede4fb"/>
      <stop offset="100%" stop-color="#dccaf8"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fce0c8"/>
      <stop offset="100%" stop-color="#efc3a3"/>
    </linearGradient>
    <linearGradient id="cardigan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9b7ad9"/>
      <stop offset="100%" stop-color="#6c45b8"/>
    </linearGradient>
    <filter id="soft" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3f2178" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="600" height="520" fill="url(#bg)"/>
  <circle cx="300" cy="240" r="185" fill="#ffffff" opacity="0.58"/>
  <!-- Sparkle Accents -->
  <path d="M120,105 L125,119 L139,124 L125,129 L120,143 L115,129 L101,124 L115,119 Z" fill="#9b7ad9" opacity="0.45"/>
  <path d="M475,135 L479,145 L489,149 L479,153 L475,163 L471,153 L461,149 L471,145 Z" fill="#7950C8" opacity="0.35"/>

  <g filter="url(#soft)">
    <!-- Soft Hair Bun Behind Head -->
    <circle cx="300" cy="72" r="40" fill="#2c2233"/>
    <path d="M214,195 C214,114 252,82 300,82 C348,82 386,114 386,195 L380,268 H220 Z" fill="#2c2233"/>

    <!-- Cardigan & Collared Shirt -->
    <path d="M120,520 C130,395 194,352 256,346 H344 C406,352 470,395 480,520 Z" fill="url(#cardigan)"/>
    <path d="M254,346 L300,478 L346,346 Z" fill="#ffffff"/>
    <!-- Pointed Blouse Collar -->
    <polygon points="256,344 294,376 266,386" fill="#f7f5fc" stroke="#d8ccf2" stroke-width="1.5"/>
    <polygon points="344,344 306,376 334,386" fill="#f7f5fc" stroke="#d8ccf2" stroke-width="1.5"/>

    <!-- Neck -->
    <rect x="276" y="274" width="48" height="54" rx="16" fill="#e6b695"/>

    <!-- Ears & Gold Hoops -->
    <ellipse cx="224" cy="212" rx="10" ry="17" fill="#eec09e"/>
    <ellipse cx="376" cy="212" rx="10" ry="17" fill="#eec09e"/>
    <circle cx="222" cy="236" r="10" fill="none" stroke="#e5b84b" stroke-width="3"/>
    <circle cx="378" cy="236" r="10" fill="none" stroke="#e5b84b" stroke-width="3"/>

    <!-- Face -->
    <path d="M228,184 C228,130 258,108 300,108 C342,108 372,130 372,184 C372,240 344,290 300,290 C256,290 228,240 228,184 Z" fill="url(#skin)"/>

    <!-- Cheeks -->
    <ellipse cx="256" cy="226" rx="16" ry="8" fill="#f29182" opacity="0.3"/>
    <ellipse cx="344" cy="226" rx="16" ry="8" fill="#f29182" opacity="0.3"/>

    <!-- Brows, Expressive Eyes, Radiant Smile -->
    <path d="M250,182 Q266,175 282,182" fill="none" stroke="#2c2233" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M318,182 Q334,175 350,182" fill="none" stroke="#2c2233" stroke-width="3.6" stroke-linecap="round"/>
    <ellipse cx="267" cy="202" rx="8" ry="6.5" fill="#211829"/>
    <ellipse cx="333" cy="202" rx="8" ry="6.5" fill="#211829"/>
    <circle cx="269" cy="200" r="2.4" fill="#ffffff"/>
    <circle cx="335" cy="200" r="2.4" fill="#ffffff"/>
    <path d="M300,204 L296,227 L305,230" fill="none" stroke="#d49d77" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M276,248 Q300,268 324,248 Z" fill="#ffffff" stroke="#b55450" stroke-width="2.8" stroke-linejoin="round"/>

    <!-- Soft Parted Bangs -->
    <path d="M216,192 C218,120 264,96 300,96 C336,96 382,120 384,192 C368,148 338,130 302,138 C286,158 248,168 216,192 Z" fill="#2c2233"/>
  </g>
</svg>
